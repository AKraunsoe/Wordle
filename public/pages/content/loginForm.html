<div class="login">
    <form id="loginForm">
        <div class="mb-3">
            <label for="accountEmail" class="form-label">Username</label>
            <input type="text" class="form-control" id="username" name="username" required>
        </div>
        <div class="mb-3">
            <label for="accountPassword" class="form-label">Password</label>
            <input type="password" class="form-control" id="accountPassword" name="password" autocomplete="new-password" required>
        </div>
        <button id="login" type="submit" class="btn btn-primary">Login</button>
    </form>
</div>
