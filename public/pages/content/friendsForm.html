<form id="friendsSearchForm">
    <div class="input-group">
        <input
            type="search"
            id="friendSearch"
            name="username"
            class="form-control"
            placeholder="Search users"
            aria-label="Search users"
        >
        <button type="submit" class="btn btn-outline-secondary d-flex align-items-center justify-content-center" aria-label="Search">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16" aria-hidden="true">
                <path d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001q.044.06.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1 1 0 0 0-.115-.099zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0"/>
            </svg>
        </button>
    </div>
</form>

<div id="friendSearchResults" class="list-group mt-3" role="list" aria-live="polite"></div>
